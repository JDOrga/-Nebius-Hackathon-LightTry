<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LightTry · 光照方案工作台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/workbench.css"></head><body>
<header><a class="brand" href="/">LightTry<span>光照方案工作台</span></a><span class="boundary">有限保真度预览 · 非物理精确渲染</span><a href="/about.html" target="_blank" rel="noopener">来源与限制</a></header>
<main><section class="workspace"><div class="photo-bar"><label>素材 <select id="photo-select"></select></label><label class="file-button">载入我的照片<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="original">打开原照片</button><span id="photo-note"></span></div>
<div class="work-grid"><section class="preview" aria-label="当前方案预览"><div class="preview-heading"><div><h1 id="view-title">读取方案…</h1><p id="view-state"></p></div><span id="identity"></span></div><div class="compare-bar"><button data-mode="result">当前结果</button><button data-mode="original">原图</button><button data-mode="original-side">原图对照</button><button data-mode="plans">两方案对照</button><select id="compare-plan" aria-label="比较另一方案"></select></div><div class="view-controls"><button id="region">完整画布 / 原照片区域</button><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">＋</button><button id="fit">适合窗口</button></div><div id="preview-panels"></div><div class="preview-footer"><button id="download" disabled>下载当前实际结果 JPEG</button><span id="source-note"></span></div><p id="warning">配置变更不伪造新效果；尚无匹配结果时只显示输入。AI 可能改变颜色、文字和材质细节。</p></section>
<aside class="configuration" aria-label="当前方案配置"><h2>当前查看 = 当前编辑参照</h2><p class="muted">修改生成新版本，旧版本保留。另存变体用于直接比较。</p><label>方案名称<input id="plan-name" maxlength="60"></label><div class="row"><button id="rename">保存名称 / 新版本</button><button id="clone">另存变体</button></div><label>环境<select id="environment"></select></label><label>环境方向偏移<select id="offset"></select></label><label>HDR 输入倍率<select id="strength"></select></label><p id="range-note" class="muted"></p><div class="row"><button id="save">保存当前方案</button><button id="reuse">在当前照片复用参数</button></div><div class="generation"><strong id="generation-summary"></strong><button id="generate" disabled>确认生成当前缺失方案</button><p id="stage"></p></div>
<details id="ai-box"><summary>Nemotron · 文字修改方案（不接收照片）</summary><p id="ai-capability"></p><textarea id="intent" maxlength="600" placeholder="例如：保留这个环境，另存一个偏暗版本比较"></textarea><button id="recommend" disabled>提出可检查的修改</button><p id="ai-status"></p><div id="proposal" hidden><p id="proposal-text"></p><button id="apply">确认应用到新版本</button><button id="discard">保留当前方案</button></div></details></aside></div>
<section class="library"><div class="library-heading"><h2>方案版本与结果</h2><p>同一照片的两个已生成方案可直接比较；旧版本不会冒充新参数结果。</p></div><div id="plan-list"></div></section><p id="error" role="alert" hidden></p><p id="storage-note" class="muted"></p></section></main><script type="module" src="/workbench.js"></script></body></html>
